apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sample-app
  namespace: sample-app
  labels:
    app: sample-app
spec:
  # Ensure at least 1 pod stays available during voluntary disruptions
  # (node drains, cluster upgrades). Pairs with the HPA minReplicas of 2.
  minAvailable: 1
  selector:
    matchLabels:
      app: sample-app
