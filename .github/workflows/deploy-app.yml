name: Build and Deploy Application

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - prod
      image_tag:
        description: 'Container image tag'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrsrelab${{ github.event.inputs.environment }}
  AKS_CLUSTER: aks-srelab-${{ github.event.inputs.environment }}
  RESOURCE_GROUP: rg-srelab-${{ github.event.inputs.environment }}
  APP_NAME: sample-app
  NAMESPACE: sample-app

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Determine image tag
      id: tag
      shell: bash
      run: |
        if [ -n "${{ github.event.inputs.image_tag }}" ]; then
          echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
        else
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

    - name: Azure login using OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to ACR
      shell: bash
      run: az acr login --name ${{ env.ACR_NAME }}

    - name: Build and push container image
      shell: bash
      run: |
        IMAGE=${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ steps.tag.outputs.image_tag }}
        docker build -t $IMAGE .
        docker push $IMAGE
        echo "Pushed image: $IMAGE"

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: ${{ github.event.inputs.environment }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Azure login using OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get AKS credentials
      shell: bash
      run: |
        az aks get-credentials \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AKS_CLUSTER }} \
          --overwrite-existing

    - name: Create namespace if not exists
      shell: bash
      run: kubectl apply -f k8s/sample-app/namespace.yaml

    - name: Deploy application manifests
      shell: bash
      run: |
        IMAGE=${{ env.ACR_NAME }}.azurecr.io/${{ env.APP_NAME }}:${{ needs.build-and-push.outputs.image_tag }}
        kubectl apply -f k8s/sample-app/serviceaccount.yaml
        kubectl apply -f k8s/sample-app/deployment.yaml
        kubectl set image deployment/${{ env.APP_NAME }} \
          ${{ env.APP_NAME }}=$IMAGE \
          -n ${{ env.NAMESPACE }}
        kubectl apply -f k8s/sample-app/service.yaml
        kubectl apply -f k8s/sample-app/hpa.yaml
        kubectl apply -f k8s/sample-app/network-policy.yaml

    - name: Wait for rollout
      shell: bash
      run: |
        kubectl rollout status deployment/${{ env.APP_NAME }} \
          -n ${{ env.NAMESPACE }} \
          --timeout=300s

    - name: Verify deployment
      shell: bash
      run: |
        echo "=== Pods ==="
        kubectl get pods -n ${{ env.NAMESPACE }}
        echo "=== Service ==="
        kubectl get svc -n ${{ env.NAMESPACE }}
